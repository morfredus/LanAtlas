<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo LanAtlas - morfredus. Tuile teal + maillage mesh (hub + 3 noeuds).
     Source de verite du logo ; l'ico/png sont generes a partir d'ici. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#338674"/>
      <stop offset="1" stop-color="#163E37"/>
    </linearGradient>
  </defs>

  <!-- tuile -->
  <rect x="0" y="0" width="256" height="256" rx="57.6" ry="57.6" fill="url(#tile)"/>
  <rect x="11.5" y="11.5" width="233" height="233" rx="46" ry="46"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="3.5"/>

  <!-- maillage : triangle discret + rayons -->
  <g stroke="#FFFDF5" stroke-linecap="round" fill="none">
    <g stroke-opacity="0.35" stroke-width="4.4">
      <path d="M128,59 L189.5,165.5 L66.5,165.5 Z"/>
    </g>
    <g stroke-opacity="0.92" stroke-width="7.7">
      <line x1="128" y1="130" x2="128" y2="59"/>
      <line x1="128" y1="130" x2="189.5" y2="165.5"/>
      <line x1="128" y1="130" x2="66.5" y2="165.5"/>
    </g>
  </g>

  <!-- noeuds satellites -->
  <g>
    <circle cx="128"   cy="59"    r="18.4" fill="#FFFDF5"/>
    <circle cx="189.5" cy="165.5" r="18.4" fill="#FFFDF5"/>
    <circle cx="66.5"  cy="165.5" r="18.4" fill="#FFFDF5"/>
    <circle cx="128"   cy="59"    r="7.7" fill="#1F5C50"/>
    <circle cx="189.5" cy="165.5" r="7.7" fill="#1F5C50"/>
    <circle cx="66.5"  cy="165.5" r="7.7" fill="#1F5C50"/>
  </g>

  <!-- hub central (accent miel morfredus) -->
  <circle cx="128" cy="130" r="34.7" fill="#1F5C50"/>
  <circle cx="128" cy="130" r="29.4" fill="#F0C94A"/>
  <circle cx="128" cy="130" r="12.9" fill="#1A1208"/>
</svg>
